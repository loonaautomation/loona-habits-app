<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loona Habits App</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
    padding: 20px; color: #fff;
  }
  .card {
    background: rgba(255,255,255,0.07); border-radius: 24px; padding: 28px 22px;
    width: 100%; max-width: 400px; backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 12px 40px rgba(0,0,0,0.4); margin: 10px 0;
  }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .header img { width: 44px; height: 44px; border-radius: 12px; }
  .header h1 { font-size: 20px; }
  .brand { font-size: 10px; color: #ffca28; letter-spacing: 2px; text-align: center; margin-bottom: 4px; }
  .sub { text-align: center; color: #aaa; font-size: 12px; margin-bottom: 20px; }
  .date-line { text-align: center; font-size: 14px; color: #ffca28; margin-bottom: 16px; font-weight: 600; }

  /* Progress */
  .progress-wrap { margin-bottom: 18px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 13px; color: #ccc; margin-bottom: 6px; }
  .progress-bar { height: 12px; background: rgba(255,255,255,0.1); border-radius: 8px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #4CAF50, #8BC34A); border-radius: 8px;
    transition: width 0.3s; width: 0%; }

  /* Habits */
  .habit {
    display: flex; align-items: center; gap: 12px; padding: 14px;
    background: rgba(255,255,255,0.05); border-radius: 14px; margin-bottom: 10px;
    cursor: pointer; border: 1px solid transparent; transition: all 0.15s;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .habit:active { transform: scale(0.98); }
  .habit.done { border-color: rgba(76,175,80,0.5); background: rgba(76,175,80,0.1); }
  .check {
    width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3);
    display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
    transition: all 0.15s;
  }
  .habit.done .check { background: #4CAF50; border-color: #4CAF50; }
  .habit-name { flex: 1; font-size: 15px; font-weight: 600; }
  .habit.done .habit-name { text-decoration: line-through; color: #aaa; }
  .streak { font-size: 13px; color: #ff9800; font-weight: bold; white-space: nowrap; }

  /* Buttons */
  .btn-toggle {
    width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,0.15); border-radius: 12px;
    background: rgba(255,255,255,0.06); color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer; margin-top: 10px; display: flex; justify-content: space-between; align-items: center;
  }
  .btn-toggle:active { background: rgba(255,255,255,0.12); }
  .btn-main {
    width: 100%; padding: 13px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #4CAF50, #2E7D32);
    color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px;
  }
  .btn-main:active { transform: scale(0.97); }
  .btn-ghost { padding: 13px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
    background: transparent; color: #fff; cursor: pointer; font-size: 14px; margin-top: 10px; }

  /* Panels */
  .panel { display: none; margin-top: 10px; padding: 16px; background: rgba(0,0,0,0.25);
    border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); }
  .panel.open { display: block; animation: fadeIn 0.2s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* History */
  .history { margin-top: 18px; }
  .history h3 { font-size: 14px; color: #aaa; margin-bottom: 8px; }
  .h-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px;
    background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 6px; font-size: 14px; }
  .h-done { color: #4CAF50; } .h-miss { color: #777; }
  .date-header {
    font-size: 13px; color: #ffca28; margin: 12px 0 6px; font-weight: bold;
    cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; background: rgba(255,202,40,0.08); border-radius: 8px;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .date-header:active { background: rgba(255,202,40,0.16); }

  /* Manage */
  .manage-row { display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 6px; font-size: 14px; }
  .del-btn { background: none; border: none; cursor: pointer; font-size: 15px; }
  #newHabit { margin-bottom: 0; }
  .add-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .add-row input { margin-bottom: 0; flex: 1; }
  .add-row button { padding: 13px 18px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #4CAF50, #2E7D32); color: #fff;
    font-size: 18px; font-weight: bold; cursor: pointer; }
  input[type=text] {
    width: 100%; padding: 13px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.09); color: #fff; font-size: 15px; outline: none;
  }
  input:focus { border-color: #4CAF50; }
  #msg { text-align: center; margin-top: 12px; font-size: 14px; min-height: 22px; }
  .ok { color: #4CAF50; } .err { color: #f44336; }

  /* Modal */
  .modal-bg { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6); z-index: 10; justify-content: center; align-items: center; padding: 20px; }
  .modal-bg.open { display: flex; }
  .modal { background: #1e1e3a; border-radius: 18px; padding: 24px; width: 100%; max-width: 360px;
    border: 1px solid rgba(255,255,255,0.12); max-height: 80vh; overflow-y: auto; }
  .modal h3 { margin-bottom: 14px; font-size: 17px; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <img id="logoImg" alt="🦅">
    <h1>Loona Habits App</h1>
  </div>
  <p class="sub">Small habits daily → big success! 🔥</p>
  <div class="brand">BY LOONA AUTOMATION</div>
  <div class="date-line" id="dateLine"></div>

  <div class="progress-wrap">
    <div class="progress-label"><span>Today's Progress</span><span id="progressText">0%</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div id="habitList"></div>
  <div id="msg"></div>

  <button class="btn-toggle" onclick="togglePanel('managePanel', this)">
    <span>⚙️ Manage Habits</span><span>▼</span>
  </button>
  <div class="panel" id="managePanel">
    <div class="add-row">
      <input type="text" id="newHabit" placeholder="New habit... e.g.: Reading">
      <button onclick="addHabit()">+</button>
    </div>
    <div id="manageList"></div>
  </div>

  <button class="btn-toggle" onclick="togglePanel('histPanel', this)">
    <span>📝 History — by date</span><span>▼</span>
  </button>
  <div class="panel" id="histPanel">
    <div id="histList"></div>
  </div>
</div>

  function getHabits() {
    var h = localStorage.getItem('lh_habits');
    if (!h) { localStorage.setItem('lh_habits', JSON.stringify(DEFAULT_HABITS)); return DEFAULT_HABITS.slice(); }
    return JSON.parse(h);
  }
  function getChecks() {
    return JSON.parse(localStorage.getItem('lh_checks') || '{}');
  }
  function saveChecks(c) {
    try { localStorage.setItem('lh_checks', JSON.stringify(c)); } catch (e) {}
  }
  function todayStr() {
    var n = new Date();
    return String(n.getDate()).padStart(2,'0') + '/' + String(n.getMonth()+1).padStart(2,'0') + '/' + n.getFullYear();
  }
  function dateAdd(ds, days) {
    var p = ds.split('/');
    var d = new Date(p[2], p[1]-1, p[0]);
    d.setDate(d.getDate() + days);
    return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
  }
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function streakOf(habit) {
    var checks = getChecks(), s = 0, d = todayStr();
    if (!checks[d] || !checks[d][habit]) d = dateAdd(d, -1);
    while (checks[d] && checks[d][habit]) { s++; d = dateAdd(d, -1); }
    return s;
  }

  function render() {
    var habits = getHabits(), checks = getChecks(), t = todayStr();
    var today = checks[t] || {};
    document.getElementById('dateLine').textContent = '📅 ' + t;

    var list = document.getElementById('habitList');
    list.innerHTML = '';
    var done = 0;
    habits.forEach(function(hb, i) {
      var isDone = !!today[hb];
      if (isDone) done++;
      var st = streakOf(hb);
      var div = document.createElement('div');
      div.className = 'habit' + (isDone ? ' done' : '');
      div.innerHTML = '<div class="check">' + (isDone ? '✅' : '') + '</div>' +
        '<div class="habit-name">' + escHtml(hb) + '</div>' +
        (st > 0 ? '<div class="streak">🔥' + st + '</div>' : '');
      div.onclick = function() { toggleHabit(hb); };
      list.appendChild(div);
    });

    var pct = habits.length ? Math.round(done / habits.length * 100) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = pct + '% (' + done + '/' + habits.length + ')';

    renderManage();
    renderHist();
  }

  function toggleHabit(hb) {
    var checks = getChecks(), t = todayStr();
    if (!checks[t]) checks[t] = {};
    checks[t][hb] = !checks[t][hb];
    if (!checks[t][hb]) delete checks[t][hb];
    saveChecks(checks);
    render();
  }

  function renderManage() {
    var habits = getHabits();
    var ml = document.getElementById('manageList');
    ml.innerHTML = '';
    habits.forEach(function(hb, i) {
      var div = document.createElement('div');
      div.className = 'manage-row';
      div.innerHTML = '<span>' + escHtml(hb) + '</span>' +
        '<button class="del-btn" onclick="delHabit(' + i + ')" title="Delete">🗑️</button>';
      ml.appendChild(div);
    });
  }

  function addHabit() {
    var v = document.getElementById('newHabit').value.trim();
    if (!v) { showMsg('Enter a habit name!', 'err'); return; }
    var habits = getHabits();
    if (habits.indexOf(v) !== -1) { showMsg('Already exists!', 'err'); return; }
    habits.push(v);
    localStorage.setItem('lh_habits', JSON.stringify(habits));
    document.getElementById('newHabit').value = '';
    render();
    showMsg('✅ "' + v + '" added!', 'ok');
  }

  function delHabit(i) {
    if (!confirm('Delete this habit?')) return;
    var habits = getHabits();
    habits.splice(i, 1);
    localStorage.setItem('lh_habits', JSON.stringify(habits));
    render();
  }

  function renderHist() {
    var checks = getChecks(), habits = getHabits();
    var dates = Object.keys(checks).sort(function(a, b) {
      var pa = a.split('/'), pb = b.split('/');
      return new Date(pb[2], pb[1]-1, pb[0]) - new Date(pa[2], pa[1]-1, pa[0]);
    });
    var list = document.getElementById('histList');
    list.innerHTML = '';
    if (!dates.length) {
      list.innerHTML = '<p style="color:#777;font-size:13px;text-align:center;">No history yet — start today! 💪</p>';
      return;
    }
    var t = todayStr();
    dates.slice(0, 30).forEach(function(d, idx) {
      var day = checks[d], doneCount = 0;
      var dh = document.createElement('div');
      dh.className = 'date-header';
      dh.innerHTML = '<span>' + (d === t ? '📅 Today (' + d + ')' : '📅 ' + d) +
        '</span><span class="arrow">' + (idx === 0 ? '▲' : '▼') + '</span>';
      var body = document.createElement('div');
      if (idx !== 0) body.style.display = 'none';
      habits.forEach(function(hb) {
        var ok = !!(day[hb]);
        if (ok) doneCount++;
        var div = document.createElement('div');
        div.className = 'h-item';
        div.innerHTML = '<span>' + escHtml(hb) + '</span>' +
          '<span class="' + (ok ? 'h-done' : 'h-miss') + '">' + (ok ? '✅' : '⬜') + '</span>';
        body.appendChild(div);
      });
      var pct = habits.length ? Math.round(doneCount / habits.length * 100) : 0;
      var bar = document.createElement('div');
      bar.className = 'h-item';
      bar.style.background = 'rgba(76,175,80,0.15)';
      bar.style.fontWeight = 'bold';
      bar.innerHTML = '<span>📊 Day Score</span><span>' + pct + '%</span>';
      body.appendChild(bar);
      dh.onclick = function() {
        var hidden = body.style.display === 'none';
        body.style.display = hidden ? 'block' : 'none';
        dh.querySelector('.arrow').textContent = hidden ? '▲' : '▼';
      };
      list.appendChild(dh);
      list.appendChild(body);
    });
  }

  function togglePanel(id, btn) {
    var p = document.getElementById(id);
    var open = p.classList.toggle('open');
    btn.querySelector('span:last-child').textContent = open ? '▲' : '▼';
  }
  function showMsg(t, c) {
    var m = document.getElementById('msg');
    m.textContent = t; m.className = c;
    setTimeout(function() { m.textContent = ''; }, 3000);
  }

  document.getElementById('logoImg').src = LOGO_B64;
  render();
</script>
